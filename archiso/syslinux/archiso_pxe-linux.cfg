LABEL arch64_nbd
TEXT HELP
Boot the CachyOS install medium using NBD.
It allows you to install CachyOS or perform system maintenance.
ENDTEXT
MENU LABEL CachyOS Mac Pro install medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-macpro61
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-macpro61.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y module_blacklist=pcspkr amdgpu.si_support=1 amdgpu.dc=0 acpi_mask_gpe=0x16 nvme_load=yes
SYSAPPEND 3

